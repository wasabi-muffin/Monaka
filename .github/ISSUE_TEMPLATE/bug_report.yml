name: 🐞 Bug report
description: Report something that isn't working as documented
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search [existing issues](https://github.com/wasabi-muffin/Monaka/issues) first to avoid duplicates.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      description: Which module does this concern?
      options:
        - ":monaka (core)"
        - ":monaka-compose"
        - ":monaka-test"
        - ":monaka-transitions"
        - ":monaka-gradle-plugin"
        - "Sample app"
        - "Documentation / website"
        - "Build / CI"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal, self-contained reproduction. A failing test using `:monaka-test` or a small `stateMachine { }` snippet is ideal.
      placeholder: |
        1. Define a state machine with '...'
        2. Dispatch action '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full stack trace or log output if there is one.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Monaka version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Affected target(s)
      multiple: true
      options:
        - Android
        - iOS (arm64 / simulatorArm64)
        - JVM
        - macOS
        - watchOS
        - tvOS
        - Linux
        - Windows
        - JS
        - Wasm
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kotlin version, Gradle version, OS, and anything else relevant.
      placeholder: |
        - Kotlin: 2.x.x
        - Gradle: 8.x
        - OS: macOS 26
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest released version (or have noted the version above).
          required: true
