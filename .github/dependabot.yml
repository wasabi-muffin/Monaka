version: 2
updates:
  # Gradle dependencies (version catalog + build scripts)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      compose:
        patterns:
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
      androidx:
        patterns:
          - "androidx.*"

  # The included Gradle plugin build
  - package-ecosystem: "gradle"
    directory: "/monaka-gradle-plugin"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
