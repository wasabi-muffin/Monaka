site_name: Monaka
site_description: A Kotlin Multiplatform MVI state machine library with a type-safe DSL and single-coroutine actor model.
site_url: https://monaka.gmvalentino.dev
repo_url: https://github.com/wasabi-muffin/monaka
repo_name: wasabi-muffin/monaka

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Getting Started: はじめに
            Installation: インストール
            Quick Start: クイックスタート
            KSP Setup (KMP): KSP セットアップ (KMP)
            Guide: ガイド
            Handlers: ハンドラー
            Error Handling: エラーハンドリング
            Lifecycle Hooks: ライフサイクルフック
            Hierarchical States: 階層的ステート
            StateMachineStore & Configs: StateMachineStore と設定
            Plugins: プラグイン
            Testing: テスト
            Multi-Machine Coordination: マルチマシン連携
            Compose Integration: Compose インテグレーション
            Architecture: アーキテクチャ
            Samples: サンプル
            Counter: カウンター
            Login: ログイン
            Timer: タイマー
            Live Feed: ライブフィード
            Checkout: チェックアウト
            Gradle Plugin: Gradle プラグイン
            YAML Generator: YAML ジェネレーター
            PlantUML Generator: PlantUML ジェネレーター
            Stub Generator: スタブジェネレーター
            Reference: リファレンス
            Store API: Store API
            KSP Annotations: KSP アノテーション
            FAQ & Troubleshooting: FAQ とトラブルシューティング

extra_css:
  - stylesheets/monaka.css

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - KSP Setup (KMP): getting-started/ksp-setup.md
  - Guide:
    - Handlers: guide/handlers.md
    - Error Handling: guide/error-handling.md
    - Lifecycle Hooks: guide/lifecycle-hooks.md
    - Hierarchical States: guide/hierarchical-states.md
    - StateMachineStore & Configs: guide/state-machine-store.md
    - Plugins: guide/plugins.md
    - Testing: guide/testing.md
    - Multi-Machine Coordination: guide/multi-machine.md
    - Compose Integration: guide/compose.md
    - Architecture: guide/architecture.md
  - Samples:
    - Counter: samples/counter.md
    - Login: samples/login.md
    - Timer: samples/timer.md
    - Live Feed: samples/live-feed.md
    - Checkout: samples/checkout.md
  - Gradle Plugin:
    - YAML Generator: gradle-plugin/yaml-generator.md
    - PlantUML Generator: gradle-plugin/puml-generator.md
    - Stub Generator: gradle-plugin/stub-generator.md
  - Reference:
    - Store API: reference/store-api.md
    - KSP Annotations: reference/ksp-annotations.md
    - FAQ & Troubleshooting: reference/faq.md
