name: NewsList
initial: Initial
states:
  Initial:
    LoadInitial:
      transition: [ InitialLoading ]
  InitialLoading:
    onEnter:
      transition: [ Stable.Initial, InitialError ]
  InitialError:
    Error.ClickRetry:
      transition: [ InitialLoading ]
  Stable:
    OnUpdateRead:
      transition: [ Stable ]
  Stable.Initial:
    ClickNews:
      effect: [ NavigateNewsDetails ]
    ClickReadAll:
      transition: [ Loading ]
  Stable.Loading:
    onEnter:
      transition: [ Initial, Error ]
  Stable.Error:
    Error.ClickOk:
      transition: [ Initial ]
